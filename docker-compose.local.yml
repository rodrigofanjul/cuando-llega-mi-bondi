# Despliegue LOCAL para ver la app en Docker (no expone nada a Internet: sin túnel).
#   docker compose -f docker-compose.local.yml up -d --build
#   → http://localhost:3000
# Fuente de arribos: el simulador (scripts/mock-mgp-upstream.mjs), destinos «MOCK …».
# Líneas, calles y paradas son las reales (datos de referencia del repo).
# Supabase: el local de `node scripts/supabase-local.mjs start` (si no está corriendo, la app
# funciona igual salvo reseñas, reportes e históricos).
services:
  mock:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/mock-mgp-upstream.mjs:/app/mock.mjs:ro
    command: ["node", "mock.mjs"]
    environment:
      PORT: "3200"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${LOCAL_SUPABASE_PUBLISHABLE_KEY:-local}
        NEXT_PUBLIC_USE_STATIC_REFERENCE: "true"
    depends_on:
      - mock
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MGP_DIRECT_DISABLED: "true"
      MGP_UPSTREAM: http://mock:3200
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_SECRET_KEY: ${LOCAL_SUPABASE_SECRET_KEY:-}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
